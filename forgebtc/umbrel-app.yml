manifestVersion: 1
id: forgebtc
category: bitcoin
name: ForgeBTC
version: "0.1.11"
tagline: Bitcoin full node + solo mining pool
description: >-
  ForgeBTC runs a Bitcoin Core node (v31.1) and connects it to the
  ForgeNX Engine as a solo mining pool.

  Features:
    - Bitcoin Core v31.1 node with automatic sync
    - Connects automatically to ForgeNX Engine via Stratum V1 & V2
    - Real-time node stats in the ForgeNX dashboard
    - Pruned by default (keeps the newest ~10 GB of blocks)
    - ZMQ block/transaction publishing for the pool engine
    - Adjustable difficulty presets (Home, Small Farm, Large Farm)
    - Merge-mines Fractal Bitcoin and Namecoin through the ForgeNX Engine
      (Merged tab) when ForgeFB / ForgeNMC are installed

  Miner connection (via ForgeNX Engine):
    - Stratum V1 URL: stratum+tcp://<your-server-ip>:3335
    - Stratum V2 URL: stratum+tcp://<your-server-ip>:4335
    - Username: your Bitcoin payout address (or address.workername)
    - Password: anything

  Notes:
    - Payout addresses: bc1q..., bc1p... (taproot), 1... or 3...
    - Needs about 25 GB of disk when pruned (the chainstate, about 11 GB,
      can't be pruned); a full, unpruned node is over 750 GB
    - The first sync takes a long time (a day or more); an SSD is strongly
      recommended
    - ForgeNX Engine must be installed and running before installing ForgeBTC

  Components:
    - Bitcoin Core v31.1 — https://bitcoincore.org
    - ForgeNX Engine (Stratum pool) — https://www.forgenx.io

  Ports:
    - P2P: 8335
    - RPC: 9003 (internal)
    - ZMQ: 28334 (internal)
    - Stratum V1: 3335 (via ForgeNX Engine)
    - Stratum V2: 4335 (via ForgeNX Engine)
developer: ForgeNX
website: https://github.com/ForgeNX/forgebtc
repo: https://github.com/ForgeNX/forgebtc
support: https://github.com/ForgeNX/forgebtc/issues
dependencies:
  - forgenx-engine
port: 80
icon: icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: ForgeNX
node_symbol: BTC
releaseDate: "2026-10-22"
