version: '3.7'

networks:
  forgenx_network:
    external: true
    name: forgenx_network
  umbrel_main_network:
    external: true
    name: umbrel_main_network

services:

  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    restart: on-failure
    environment:
      APP_HOST: forgebtc-ui
      APP_PORT: 80
      DEVICE_DOMAIN_NAME: forgenx.local
      JWT_SECRET: ${JWT_SECRET}
      MANAGER_IP: ${HOST_IP}
      PROXY_AUTH_ADD: 'false'
      UMBREL_AUTH_SECRET: ${APP_PASSWORD}
    networks:
      - umbrel_main_network
    volumes:
      - /opt/forgenx/apps/forgebtc/umbrel-app.yml:/extra/umbrel-app.yml:ro

  init-permissions:
    image: alpine:3.19
    restart: 'no'
    command: >
      sh -c "
        mkdir -p /data/node &&
        mkdir -p /data/logs &&
        mkdir -p /host-coins &&
        chown -R 1000:1000 /data
      "
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/lib/forgenx/shared/forgenx/coins:/host-coins

  ui:
    image: ghcr.io/forgenx/forgebtc-ui:0.1.1
    container_name: forgebtc-ui
    restart: unless-stopped
    networks:
      - umbrel_main_network
      - forgenx_network

  node:
    image: ghcr.io/forgenx/forgebtc:0.1.2
    container_name: forgebtc-node
    stop_grace_period: 15m30s
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      - BTC_RPC_USER=${BTC_RPC_USER:-forgebtc}
      - BTC_RPC_PORT=${BTC_RPC_PORT:-9003}
      - BTC_RPC_PASS=${BTC_RPC_PASS}
      - BTC_PRUNE=${BTC_PRUNE:-10000}
      - BTC_NETWORK=${BTC_NETWORK:-mainnet}
      - BTC_AUTO_START=${BTC_AUTO_START:-true}
      - BTC_PAYOUT_ADDRESS=${BTC_PAYOUT_ADDRESS:-}
      - BTC_WORKER_NAME=${BTC_WORKER_NAME:-}
      - BTC_DIFF_PRESET=${BTC_DIFF_PRESET:-home}
      - BTC_START_DIFF=${BTC_START_DIFF:-128}
      - BTC_MIN_DIFF=${BTC_MIN_DIFF:-32}
      - BTC_MAX_DIFF=${BTC_MAX_DIFF:-4096}
      - BTC_DONATION1_ADDR=${BTC_DONATION1_ADDR:-}
      - BTC_DONATION1_ENABLED=${BTC_DONATION1_ENABLED:-true}
      - BTC_DONATION1_PCT=${BTC_DONATION1_PCT:-1.0}
      - BTC_DONATION2_ENABLED=${BTC_DONATION2_ENABLED:-false}
      - BTC_DONATION2_ADDR=${BTC_DONATION2_ADDR:-}
      - BTC_DONATION2_PCT=${BTC_DONATION2_PCT:-0}
      - COIN_ID=btc
      - STRATUM_PORT=3335
      - P2P_PORT=8335
      - RPC_PORT=9003
      - ZMQ_PORT=28334
    ports:
      - "8335:8335"    # P2P
      - "9003:9003"    # RPC (internal use only)
      - "28334:28334"  # ZMQ
    volumes:
      - ${APP_DATA_DIR}/data/node:/data/.bitcoin
      - /var/lib/forgenx/shared/forgenx/coins:/pool/coins
      - ${APP_DATA_DIR}/data/logs:/data/logs
    networks:
      umbrel_main_network:
      forgenx_network:
        aliases:
          - forgebtc-node
