version: '3.7'

networks:
  forgenx_network:
    external: true
    name: forgenx_network
  umbrel_main_network:
    external: true
    name: umbrel_main_network

services:

  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    restart: unless-stopped
    environment:
      APP_HOST: forgexec-ui
      APP_PORT: 80
      DEVICE_DOMAIN_NAME: forgenx.local
      JWT_SECRET: ${JWT_SECRET}
      MANAGER_IP: ${HOST_IP}
      PROXY_AUTH_ADD: 'false'
      UMBREL_AUTH_SECRET: ${APP_PASSWORD}
    networks:
      - umbrel_main_network
    volumes:
      - /opt/forgenx/apps/forgexec/umbrel-app.yml:/extra/umbrel-app.yml:ro

  init-permissions:
    image: alpine:3.24
    restart: 'no'
    command: >
      sh -c "
        mkdir -p /data/node &&
        mkdir -p /data/logs &&
        mkdir -p /host-coins &&
        chown -R 1000:1000 /data
      "
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/lib/forgenx/shared/forgenx/coins:/host-coins

  ui:
    image: ghcr.io/forgenx/forgexec-ui:0.1.10
    container_name: forgexec-ui
    restart: unless-stopped
    networks:
      - umbrel_main_network
      - forgenx_network

  node:
    image: ghcr.io/forgenx/forgexec:0.1.4
    container_name: forgexec-node
    stop_grace_period: 15m30s
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      - XEC_RPC_USER=${XEC_RPC_USER:-forgexec}
      - XEC_RPC_PORT=${XEC_RPC_PORT:-9004}
      - XEC_RPC_PASS=${XEC_RPC_PASS}
      - XEC_PRUNE=${XEC_PRUNE:-10000}
      - XEC_NETWORK=${XEC_NETWORK:-mainnet}
      - XEC_AUTO_START=${XEC_AUTO_START:-true}
      - XEC_PAYOUT_ADDRESS=${XEC_PAYOUT_ADDRESS:-}
      - XEC_WORKER_NAME=${XEC_WORKER_NAME:-}
      - XEC_DIFF_PRESET=${XEC_DIFF_PRESET:-home}
      - XEC_START_DIFF=${XEC_START_DIFF:-128}
      - XEC_MIN_DIFF=${XEC_MIN_DIFF:-32}
      - XEC_MAX_DIFF=${XEC_MAX_DIFF:-4096}
      - XEC_DONATION1_ADDR=${XEC_DONATION1_ADDR:-}
      - XEC_DONATION1_ENABLED=${XEC_DONATION1_ENABLED:-true}
      - XEC_DONATION1_PCT=${XEC_DONATION1_PCT:-1.0}
      - XEC_DONATION2_ENABLED=${XEC_DONATION2_ENABLED:-false}
      - XEC_DONATION2_ADDR=${XEC_DONATION2_ADDR:-}
      - XEC_DONATION2_PCT=${XEC_DONATION2_PCT:-0}
      - COIN_ID=xec
      - STRATUM_PORT=3336
      - P2P_PORT=8337
      - RPC_PORT=9004
      - ZMQ_PORT=28335
    ports:
      - "8337:8337"    # P2P
      - "9004:9004"    # RPC (internal use only)
      - "28335:28335"  # ZMQ
    volumes:
      - ${APP_DATA_DIR}/data/node:/data/.bitcoin
      - /var/lib/forgenx/shared/forgenx/coins:/pool/coins
      - ${APP_DATA_DIR}/data/logs:/data/logs
    networks:
      umbrel_main_network:
      forgenx_network:
        aliases:
          - forgexec-node
