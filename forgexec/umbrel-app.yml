manifestVersion: 1
id: forgexec
category: bitcoin
name: ForgeXEC
version: "0.1.5"
tagline: eCash full node + solo mining pool
description: >-
  ForgeXEC runs an eCash (XEC) node (Bitcoin ABC v0.34.1) and connects it to
  the ForgeNX Engine as a solo mining pool.

  Features:
    - Bitcoin ABC v0.34.1 node with automatic sync, Avalanche on
    - Connects automatically to ForgeNX Engine via Stratum V1 & V2
    - Real-time node stats in the ForgeNX dashboard
    - Pruned by default (keeps the newest ~10 GB of blocks)
    - ZMQ block/transaction publishing for the pool engine
    - Adjustable difficulty presets (Home, Small Farm, Large Farm)
    - Can carry Fractal Bitcoin and Namecoin by merged mining (ForgeNX Engine,
      Merged tab)

  Miner connection (via ForgeNX Engine):
    - Stratum V1 URL: stratum+tcp://<your-server-ip>:3336
    - Stratum V2 URL: stratum+tcp://<your-server-ip>:4336
    - Username: your eCash payout address (or address.workername)
    - Password: anything

  How an eCash block reward is paid:
    - 58% to you (the miner)
    - 32% to the eCash miner fund (development), required by the network
    - 10% to eCash staking rewards, required by the network
    - Every block found includes these; a block without them is rejected

  Notes:
    - eCash blocks come every 10 minutes on average
    - Real Time Targeting: a block found very soon after the last one must
      meet a harder target; the engine only sends blocks that do
    - Payout addresses: ecash:q... (CashAddr) or legacy 1.../3...
    - The first sync takes several hours; an SSD is strongly recommended
    - ForgeNX Engine must be installed and running before installing ForgeXEC

  Components:
    - Bitcoin ABC v0.34.1 — https://www.bitcoinabc.org
    - ForgeNX Engine (Stratum pool) — https://www.forgenx.io

  Ports:
    - P2P: 8337
    - RPC: 9004 (internal)
    - ZMQ: 28335 (internal)
    - Stratum V1: 3336 (via ForgeNX Engine)
    - Stratum V2: 4336 (via ForgeNX Engine)
developer: ForgeNX
website: https://github.com/ForgeNX/forgexec
repo: https://github.com/ForgeNX/forgexec
support: https://github.com/ForgeNX/forgexec/issues
dependencies:
  - forgenx-engine
port: 80
icon: icon.png
