manifestVersion: 1
id: forgebch
category: bitcoin
name: ForgeBCH
version: "1.0.217"
tagline: Bitcoin Cash full node + solo mining pool
description: >-
  ForgeBCH runs a Bitcoin Cash full node (BCHN v29.2.0) and connects it
  to the ForgeNX Engine as a solo mining pool.

  Features:
    - BCHN v29.2.0 full node with automatic sync
    - Connects automatically to ForgeNX Engine via Stratum V1 & V2
    - Stratum V1 (standard TCP)
    - Stratum V2 with standard and extended channels (Noise Protocol, ChaCha20-Poly1305 encryption)
    - Real-time node stats in the ForgeNX dashboard
    - Pruned by default (keeps the newest ~10 GB of blocks); switch Prune
      off in Settings for a full node, which needs far more disk
    - New-block notices (ZMQ) for the pool engine
    - Adjustable difficulty presets (Home, Small Farm, Large Farm)

  Miner connection (via ForgeNX Engine):
    - Stratum V1 URL: stratum+tcp://<your-server-ip>:3334
    - Stratum V2 URL: stratum+tcp://<your-server-ip>:4334
    - Username: your payout address (or address.workername)
    - Password: anything
    - Stratum V2: add the authority public key from the Overview tab to your miner's pool settings

  Notes:
    - A 1% development fee from each block found goes to ForgeNX. You can
      add a donation of your own to any address in the app's Settings
    - Use a legacy BCH address (starts with 1... or 3...) for widest miner compatibility
    - CashAddr format (bitcoincash:q...) is also supported and auto-converted
    - First sync can take several hours depending on hardware
    - SSD strongly recommended for node performance
    - ForgeNX Engine must be installed and running before installing ForgeBCH

  Components:
    - Bitcoin Cash Node (BCHN) v29.2.0 — https://github.com/bitcoin-cash-node/bitcoin-cash-node
    - ForgeNX Engine (Stratum pool) — https://www.forgenx.io

  Ports:
    - P2P: 8333
    - RPC: 9002 (internal)
    - ZMQ: 28333 (internal)
    - Stratum V1: 3334 (via ForgeNX Engine)
    - Stratum V2: 4334 (via ForgeNX Engine)

developer: ForgeNX
website: https://www.forgenx.io
repo: https://www.forgenx.io
support: https://www.forgenx.io
dependencies:
  - forgenx-engine
port: 80
icon: icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: ForgeNX
node_symbol: BCH
disk_gb: 20  # about how much disk it needs (pruned node: the newest ~10 GB of blocks plus the chainstate, about 4 GB); ForgeNX checks for it before installing
releaseDate: "2026-11-16"
