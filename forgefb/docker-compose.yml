version: '3.7'

networks:
  forgenx_network:
    external: true
    name: forgenx_network
  umbrel_main_network:
    external: true
    name: umbrel_main_network

services:

  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    restart: unless-stopped
    environment:
      APP_HOST: forgefb-ui
      APP_PORT: 80
      DEVICE_DOMAIN_NAME: forgenx.local
      JWT_SECRET: ${JWT_SECRET}
      MANAGER_IP: ${HOST_IP}
      PROXY_AUTH_ADD: 'false'
      UMBREL_AUTH_SECRET: ${APP_PASSWORD}
    networks:
      - umbrel_main_network
    volumes:
      - /opt/forgenx/apps/forgefb/umbrel-app.yml:/extra/umbrel-app.yml:ro

  init-permissions:
    image: alpine:3.24
    restart: 'no'
    command: >
      sh -c "
        mkdir -p /data/node &&
        mkdir -p /data/logs &&
        mkdir -p /host-coins &&
        chown -R 1000:1000 /data
      "
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/lib/forgenx/shared/forgenx/coins:/host-coins

  ui:
    image: ghcr.io/forgenx/forgefb-ui:0.1.11
    container_name: forgefb-ui
    restart: unless-stopped
    networks:
      - umbrel_main_network
      - forgenx_network

  node:
    image: ghcr.io/forgenx/forgefb:0.1.5
    container_name: forgefb-node
    stop_grace_period: 15m30s
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      - FB_RPC_USER=${FB_RPC_USER:-forgefb}
      - FB_RPC_PORT=${FB_RPC_PORT:-9005}
      - FB_RPC_PASS=${FB_RPC_PASS}
      - FB_PRUNE=${FB_PRUNE:-10000}
      - FB_NETWORK=${FB_NETWORK:-mainnet}
      - FB_AUTO_START=${FB_AUTO_START:-true}
      - FB_PAYOUT_ADDRESS=${FB_PAYOUT_ADDRESS:-}
      - FB_WORKER_NAME=${FB_WORKER_NAME:-}
      - FB_DIFF_PRESET=${FB_DIFF_PRESET:-home}
      - FB_START_DIFF=${FB_START_DIFF:-128}
      - FB_MIN_DIFF=${FB_MIN_DIFF:-32}
      - FB_MAX_DIFF=${FB_MAX_DIFF:-4096}
      - FB_DONATION1_ADDR=${FB_DONATION1_ADDR:-}
      - FB_DONATION1_ENABLED=${FB_DONATION1_ENABLED:-true}
      - FB_DONATION1_PCT=${FB_DONATION1_PCT:-1.0}
      - FB_DONATION2_ENABLED=${FB_DONATION2_ENABLED:-false}
      - FB_DONATION2_ADDR=${FB_DONATION2_ADDR:-}
      - FB_DONATION2_PCT=${FB_DONATION2_PCT:-0}
      - COIN_ID=fb
      - STRATUM_PORT=3337
      - P2P_PORT=8339
      - RPC_PORT=9005
      - ZMQ_PORT=28336
    ports:
      - "8339:8339"    # P2P
      - "9005:9005"    # RPC (internal use only)
      - "28336:28336"  # ZMQ
    volumes:
      - ${APP_DATA_DIR}/data/node:/data/.bitcoin
      - /var/lib/forgenx/shared/forgenx/coins:/pool/coins
      - ${APP_DATA_DIR}/data/logs:/data/logs
    networks:
      umbrel_main_network:
      forgenx_network:
        aliases:
          - forgefb-node
