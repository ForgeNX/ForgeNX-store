manifestVersion: 1
id: forgefb
category: bitcoin
name: ForgeFB
version: "0.1.21"
tagline: Fractal Bitcoin full node + solo mining pool
description: >-
  ForgeFB runs a Fractal Bitcoin node (v0.4.0) and connects it to the
  ForgeNX Engine as a solo mining pool.

  Features:
    - Fractal Bitcoin v0.4.0 node with automatic sync
    - Connects automatically to ForgeNX Engine via Stratum V1 & V2
    - Real-time node stats in the ForgeNX dashboard
    - Pruned by default (keeps the newest ~10 GB of blocks)
    - ZMQ block/transaction publishing for the pool engine
    - Adjustable difficulty presets (Home, Small Farm, Large Farm)

  Miner connection (via ForgeNX Engine):
    - Stratum V1 URL: stratum+tcp://<your-server-ip>:3337
    - Stratum V2 URL: stratum+tcp://<your-server-ip>:4337
    - Username: your Fractal payout address (or address.workername)
    - Password: anything

  Notes:
    - Fractal Bitcoin is a SHA-256 chain built from Bitcoin Core's code, with
      30-second blocks on average
    - Fractal uses Bitcoin's address formats (bc1q..., bc1p..., 1..., 3...)
    - Needs about 230 GB of disk even when pruned, and growing (the
      chainstate alone is ~220 GB); an SSD is strongly recommended
    - The first sync takes a long time
    - ForgeNX Engine must be installed and running before installing ForgeFB

  Components:
    - Fractal Bitcoin node v0.4.0 — https://github.com/fractal-bitcoin/fractald-release
    - ForgeNX Engine (Stratum pool) — https://www.forgenx.io

  Ports:
    - P2P: 8339
    - RPC: 9005 (internal)
    - ZMQ: 28336 (internal)
    - Stratum V1: 3337 (via ForgeNX Engine)
    - Stratum V2: 4337 (via ForgeNX Engine)
developer: ForgeNX
website: https://github.com/ForgeNX/forgefb
repo: https://github.com/ForgeNX/forgefb
support: https://github.com/ForgeNX/forgefb/issues
dependencies:
  - forgenx-engine
port: 80
icon: icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: ForgeNX
node_symbol: FB
disk_gb: 260  # about how much disk it needs (pruned node: the chainstate alone is ~220 GB and growing); ForgeNX checks for it before installing
releaseDate: "2026-10-31"
