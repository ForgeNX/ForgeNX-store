version: '3.7'

networks:
  forgenx_network:
    external: true
    name: forgenx_network
  umbrel_main_network:
    external: true
    name: umbrel_main_network

services:

  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    restart: on-failure
    environment:
      APP_HOST: forgebc2-ui
      APP_PORT: 80
      DEVICE_DOMAIN_NAME: forgenx.local
      JWT_SECRET: ${JWT_SECRET}
      MANAGER_IP: ${HOST_IP}
      PROXY_AUTH_ADD: 'false'
      UMBREL_AUTH_SECRET: ${APP_PASSWORD}
    networks:
      - umbrel_main_network
    volumes:
      - /opt/forgenx/apps/forgebc2/umbrel-app.yml:/extra/umbrel-app.yml:ro

  init-permissions:
    image: alpine:3.19
    restart: 'no'
    command: >
      sh -c "
        mkdir -p /data/node &&
        mkdir -p /data/node-bin &&
        mkdir -p /data/logs &&
        mkdir -p /host-coins &&
        chown -R 1000:1000 /data
      "
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/lib/forgenx/shared/forgenx/coins:/host-coins

  ui:
    image: ghcr.io/forgenx/forgebc2-ui:0.1.0
    container_name: forgebc2-ui
    restart: unless-stopped
    networks:
      - umbrel_main_network
      - forgenx_network

  node:
    image: ghcr.io/forgenx/forgebc2:0.1.0
    container_name: forgebc2-node
    stop_grace_period: 15m30s
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      - BC2_RPC_USER=${BC2_RPC_USER:-forgebc2}
      - BC2_RPC_PORT=${BC2_RPC_PORT:-9006}
      - BC2_RPC_PASS=${BC2_RPC_PASS}
      - BC2_PRUNE=${BC2_PRUNE:-10000}
      - BC2_NETWORK=${BC2_NETWORK:-mainnet}
      - BC2_AUTO_START=${BC2_AUTO_START:-true}
      - BC2_PAYOUT_ADDRESS=${BC2_PAYOUT_ADDRESS:-}
      - BC2_WORKER_NAME=${BC2_WORKER_NAME:-}
      - BC2_DIFF_PRESET=${BC2_DIFF_PRESET:-home}
      - BC2_START_DIFF=${BC2_START_DIFF:-128}
      - BC2_MIN_DIFF=${BC2_MIN_DIFF:-32}
      - BC2_MAX_DIFF=${BC2_MAX_DIFF:-4096}
      - BC2_DONATION1_ADDR=${BC2_DONATION1_ADDR:-}
      - BC2_DONATION1_ENABLED=${BC2_DONATION1_ENABLED:-true}
      - BC2_DONATION1_PCT=${BC2_DONATION1_PCT:-1.0}
      - BC2_DONATION2_ENABLED=${BC2_DONATION2_ENABLED:-false}
      - BC2_DONATION2_ADDR=${BC2_DONATION2_ADDR:-}
      - BC2_DONATION2_PCT=${BC2_DONATION2_PCT:-0}
      - COIN_ID=bc2
      - STRATUM_PORT=3338
      - P2P_PORT=8341
      - RPC_PORT=9006
      - ZMQ_PORT=28337
    ports:
      - "8341:8341"    # P2P
      - "9006:9006"    # RPC (internal use only)
      - "28337:28337"  # ZMQ
    volumes:
      - ${APP_DATA_DIR}/data/node:/data/.bitcoinII
      # BitcoinII Core itself, downloaded from its official release on the
      # first start (see the Dockerfile)
      - ${APP_DATA_DIR}/data/node-bin:/opt/bitcoinII
      - /var/lib/forgenx/shared/forgenx/coins:/pool/coins
      - ${APP_DATA_DIR}/data/logs:/data/logs
    networks:
      umbrel_main_network:
      forgenx_network:
        aliases:
          - forgebc2-node
