manifestVersion: 1
id: forgenmc
category: bitcoin
name: ForgeNMC
version: "0.1.7"
tagline: Namecoin full node, merge-mined with ForgeNX Engine
description: >-
  ForgeNMC runs a Namecoin node (v28.0) for ForgeNX Engine to merge-mine.
  Namecoin has no pool of its own: the engine mines it with the same work as
  a SHA-256 coin you already mine (Bitcoin Cash, Bitcoin, eCash...), so your
  miners earn Namecoin blocks as well, with no extra hashrate.

  Features:
    - Namecoin Core v28.0 node with automatic sync
    - Merged mining through ForgeNX Engine (the engine's Merged tab)
    - Real-time node stats in the ForgeNX dashboard
    - Pruned by default (keeps the newest ~2 GB of blocks)

  Merged mining:
    - Set a Namecoin payout address in ForgeNMC's Settings
    - In ForgeNX Engine's Merged tab, turn merged mining on for a primary
      coin and tick Namecoin
    - Miners keep mining the primary coin as before; nothing changes on them

  Notes:
    - Namecoin addresses start with N or M (legacy), 6 (script) or nc1 (bech32)
    - Namecoin's blocks come about every 10 minutes, at a difficulty set by
      its own merged miners
    - ForgeNX Engine must be installed and running before installing ForgeNMC

  Components:
    - Namecoin Core v28.0 — https://www.namecoin.org/download/
    - ForgeNX Engine — https://github.com/ForgeNX/forgenx-engine

  Ports:
    - P2P: 8347
    - RPC: 9009 (internal)
    - ZMQ: 28340 (internal)
developer: ForgeNX
website: https://github.com/ForgeNX/forgenmc
repo: https://github.com/ForgeNX/forgenmc
support: https://github.com/ForgeNX/forgenmc/issues
dependencies:
  - forgenx-engine
port: 80
icon: icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: ForgeNX
node_symbol: NMC
disk_gb: 6  # about how much disk it needs (pruned node, ~2 GB of blocks plus the chainstate and name index); ForgeNX checks for it before installing
releaseDate: "2026-10-17"
