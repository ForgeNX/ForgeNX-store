version: '3.7'

networks:
  forgenx_network:
    external: true
    name: forgenx_network
  umbrel_main_network:
    external: true
    name: umbrel_main_network

services:

  app_proxy:
    image: getumbrel/app-proxy:1.7.0
    restart: unless-stopped
    environment:
      APP_HOST: forgebch2-ui
      APP_PORT: 80
      DEVICE_DOMAIN_NAME: forgenx.local
      JWT_SECRET: ${JWT_SECRET}
      MANAGER_IP: ${HOST_IP}
      PROXY_AUTH_ADD: 'false'
      UMBREL_AUTH_SECRET: ${APP_PASSWORD}
    networks:
      - umbrel_main_network
    volumes:
      - /opt/forgenx/apps/forgebch2/umbrel-app.yml:/extra/umbrel-app.yml:ro

  init-permissions:
    image: alpine:3.24
    restart: 'no'
    command: >
      sh -c "
        mkdir -p /data/node &&
        mkdir -p /data/logs &&
        mkdir -p /host-coins &&
        chown -R 1000:1000 /data
      "
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - /var/lib/forgenx/shared/forgenx/coins:/host-coins

  ui:
    image: ghcr.io/forgenx/forgebch2-ui:0.1.0
    container_name: forgebch2-ui
    restart: unless-stopped
    networks:
      - umbrel_main_network
      - forgenx_network

  node:
    image: ghcr.io/forgenx/forgebch2:0.1.0
    container_name: forgebch2-node
    stop_grace_period: 15m30s
    restart: unless-stopped
    depends_on:
      init-permissions:
        condition: service_completed_successfully
    environment:
      - BCH2_RPC_USER=${BCH2_RPC_USER:-forgebch2}
      - BCH2_RPC_PORT=${BCH2_RPC_PORT:-9010}
      - BCH2_RPC_PASS=${BCH2_RPC_PASS}
      - BCH2_PRUNE=${BCH2_PRUNE:-10000}
      - BCH2_NETWORK=${BCH2_NETWORK:-mainnet}
      - BCH2_AUTO_START=${BCH2_AUTO_START:-true}
      - BCH2_PAYOUT_ADDRESS=${BCH2_PAYOUT_ADDRESS:-}
      - BCH2_WORKER_NAME=${BCH2_WORKER_NAME:-}
      - BCH2_DIFF_PRESET=${BCH2_DIFF_PRESET:-home}
      - BCH2_START_DIFF=${BCH2_START_DIFF:-128}
      - BCH2_MIN_DIFF=${BCH2_MIN_DIFF:-32}
      - BCH2_MAX_DIFF=${BCH2_MAX_DIFF:-4096}
      - BCH2_DONATION1_ADDR=${BCH2_DONATION1_ADDR:-}
      - BCH2_DONATION1_ENABLED=${BCH2_DONATION1_ENABLED:-true}
      - BCH2_DONATION1_PCT=${BCH2_DONATION1_PCT:-1.0}
      - BCH2_DONATION2_ENABLED=${BCH2_DONATION2_ENABLED:-false}
      - BCH2_DONATION2_ADDR=${BCH2_DONATION2_ADDR:-}
      - BCH2_DONATION2_PCT=${BCH2_DONATION2_PCT:-0}
      - COIN_ID=bch2
      - STRATUM_PORT=3342
      - P2P_PORT=8349
      - RPC_PORT=9010
      - ZMQ_PORT=28341
    ports:
      - "8349:8349"    # P2P
      - "9010:9010"    # RPC (internal use only)
      - "28341:28341"  # ZMQ
    volumes:
      - ${APP_DATA_DIR}/data/node:/data/.bitcoincashII
      - /var/lib/forgenx/shared/forgenx/coins:/pool/coins
      - ${APP_DATA_DIR}/data/logs:/data/logs
    networks:
      umbrel_main_network:
      forgenx_network:
        aliases:
          - forgebch2-node
