manifestVersion: 1
id: forgedgb
category: bitcoin
name: ForgeDGB
version: "0.1.48"
tagline: DigiByte full node + solo mining pool
description: >-
  ForgeDGB runs a DigiByte full node (DigiByteCore v9.26.5) and connects it
  to the ForgeNX Engine as a solo mining pool.
  Features:
    - DigiByteCore v9.26.5 full node with automatic sync
    - Connects automatically to ForgeNX Engine via Stratum
    - Real-time node stats in the ForgeNX dashboard
    - Pruned mode support (saves disk space, min 2000 MB)
    - ZMQ block/transaction publishing for pool engine
    - Adjustable difficulty presets (Home, Small Farm, Large Farm)
  Miner connection (via ForgeNX Engine):
    - URL: stratum+tcp://<your-server-ip>:4333
    - Username: your DGB payout address (or address.workername)
    - Password: anything
  Notes:
    - Use a native DGB address (starts with D) for widest miner compatibility
    - First sync can take several hours depending on hardware
    - SSD strongly recommended for node performance
    - ForgeNX Engine must be installed and running before installing ForgeDGB
  Components:
    - DigiByteCore v9.26.5 — https://github.com/DigiByte-Core/digibyte
    - ForgeNX Engine (Stratum pool) — https://github.com/ForgeNX/forgenx-engine
  Ports:
    - P2P: 12024
    - RPC: 9001 (internal)
    - ZMQ: 28332 (internal)
    - Stratum: 4333 (via ForgeNX Engine)
  Status:
    - v0.1.1: Production ready. Stable full node + solo pool operation confirmed.
developer: ForgeNX
website: https://github.com/ForgeNX/forgedgb
repo: https://github.com/ForgeNX/forgedgb
